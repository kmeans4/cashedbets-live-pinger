name: live-tick

# GitHub can delay or drop frequent scheduled events. This hourly bootstrap
# starts a five-minute worker before known game windows; the worker hands off
# to a new workflow run before GitHub's six-hour hosted-runner limit.
on:
  schedule:
    # Offset from the heavily contended start of each hour.
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  actions: write
  contents: read

concurrency:
  group: live-tick
  cancel-in-progress: false

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v5
      - name: Run resilient game-window worker
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          FANTASY_REFRESH_SECRET: ${{ secrets.FANTASY_REFRESH_SECRET }}
          GH_TOKEN: ${{ github.token }}
        run: |
          scripts/live-window-worker.sh
