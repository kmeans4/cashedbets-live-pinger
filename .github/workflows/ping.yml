name: live-tick

# GitHub can delay or drop frequent scheduled events. This hourly bootstrap
# starts a quota-aware worker before known game windows; the worker hands off
# to a new workflow run before GitHub's six-hour hosted-runner limit.
on:
  schedule:
    # Offset from the heavily contended start of each hour.
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  actions: write
  contents: read

concurrency:
  group: live-tick
  cancel-in-progress: false

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      # actions/checkout v5, pinned so a mutable upstream tag cannot run with
      # the workflow's invocation secrets or actions:write permission.
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - name: Run resilient game-window worker
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          FANTASY_REFRESH_SECRET: ${{ secrets.FANTASY_REFRESH_SECRET }}
          GH_TOKEN: ${{ github.token }}
          # Five-minute live ticks keep scoring visitor-independent while
          # protecting provider, Vercel, and Neon usage. Faster polling must be
          # an explicit repository setting backed by a reviewed quota budget.
          TICK_SECONDS: ${{ vars.TANK01_LIVE_TICK_SECONDS || '300' }}
        run: |
          scripts/live-window-worker.sh
